plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def copyVocabulary = tasks.register('copyVocabularyJson', Copy) {
    def src = rootProject.file('../web/data/vocabulary.json')
    from src
    into layout.projectDirectory.dir('src/main/assets')
    onlyIf { src.exists() }
}

tasks.named('preBuild').configure { dependsOn copyVocabulary }

android {
    namespace 'com.cltf.aienglish'
    compileSdk 34

    defaultConfig {
        applicationId "com.cltf.aienglish"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // 模拟器访问本机代理用 10.0.2.2；真机本机代理可改为 127.0.0.1 后重新编译
        buildConfigField "String", "AI_PROXY_HOST", "\"10.0.2.2\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.13.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
